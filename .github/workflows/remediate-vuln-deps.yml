name: remediate-vuln-deps

on:
  push:
    branches: [security/harden-paths-and-ci]

permissions:
  contents: write

concurrency:
  group: remediate-vuln-deps
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: security/harden-paths-and-ci
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: '1.25'
          cache-dependency-path: src/main/jni/core/go.sum
      - name: Upgrade vulnerable modules to fixed versions
        working-directory: src/main/jni/core
        run: |
          go get golang.org/x/net@v0.56.0 golang.org/x/text@v0.39.0
          go mod tidy
          go list -m golang.org/x/net golang.org/x/text
      - name: Commit remediated module locks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/jni/core/go.mod src/main/jni/core/go.sum
          if git diff --cached --quiet; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git commit -m 'security: upgrade vulnerable Go networking dependencies'
          git push origin HEAD:security/harden-paths-and-ci
