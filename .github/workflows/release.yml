name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/mihomo-alpha-20260827'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NDK_VERSION: 28.0.13004108
  ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk/28.0.13004108
  JAVA_VERSION: '17'
  GO_VERSION: '1.25'
  GO_TAGS: with_gvisor,cmfa,no_tailscale
  RELEASE_TAG: v0.3.2-alpha.20260827

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/main/jni/core/go.sum

      - name: Setup JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@b5c8a0dca2731e85b6e85238a73680f5151738e9  # v4.3.1

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ env.ANDROID_NDK_PATH }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      - name: Install NDK if cache miss
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"

      - name: Normalize Go module graph
        working-directory: src/main/jni/core
        run: |
          go mod tidy
          go list -m github.com/metacubex/mihomo

      - name: Upload normalized module locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: module-locks
          path: |
            src/main/jni/core/go.mod
            src/main/jni/core/go.sum

      - name: Build libclash.so for all ABIs
        env:
          ANDROID_NDK: ${{ env.ANDROID_NDK_PATH }}
        run: ./build-native.sh

      - name: Verify JNI exports
        run: ./scripts/check-jni-exports.sh

      - name: Build AAR
        run: ./gradlew :assembleRelease --no-daemon

      - name: Prepare release files
        run: |
          mkdir -p dist
          AAR="libmihomo-android-${RELEASE_TAG}.aar"
          cp build/outputs/aar/libmihomo-android-release.aar "dist/$AAR"
          (cd dist && sha256sum "$AAR" > "$AAR.sha256")
          CORE=$(cd src/main/jni/core && go list -m -f '{{.Version}}' github.com/metacubex/mihomo)
          ABI=$(grep -oE 'EXPECTED_BRIDGE_ABI: Int = [0-9]+' src/main/kotlin/io/github/oviron/libmihomo/Clash.kt | grep -oE '[0-9]+$')
          SHA=$(cut -d' ' -f1 "dist/$AAR.sha256")
          jq -n --arg w "$RELEASE_TAG" --arg cv "$CORE" --argjson abi "$ABI" --arg aar "$AAR" --arg sha "$SHA" \
            '{wrapper:$w, core:{name:"mihomo", version:$cv}, bridgeABI:$abi, abis:["arm64-v8a","armeabi-v7a","x86_64"], aar:$aar, sha256:$sha}' \
            > "dist/libmihomo-android-${RELEASE_TAG}.metadata.json"
          cat "dist/libmihomo-android-${RELEASE_TAG}.metadata.json"
          cat "dist/$AAR.sha256"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: libmihomo-android-aar
          path: dist/*

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }} (latest mihomo alpha)
          prerelease: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
