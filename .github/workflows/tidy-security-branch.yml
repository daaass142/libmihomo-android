name: tidy-security-branch

on:
  push:
    branches: [security/harden-paths-and-ci]

permissions:
  contents: write

concurrency:
  group: tidy-security-branch
  cancel-in-progress: true

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: security/harden-paths-and-ci
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: '1.25'
          cache-dependency-path: src/main/jni/core/go.sum
      - name: Normalize module graph
        working-directory: src/main/jni/core
        run: go mod tidy
      - name: Commit normalized locks
        run: |
          if git diff --quiet -- src/main/jni/core/go.mod src/main/jni/core/go.sum; then
            echo 'Module locks already tidy.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/jni/core/go.mod src/main/jni/core/go.sum
          git commit -m 'build: normalize mihomo module locks'
          git push origin HEAD:security/harden-paths-and-ci
