name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.0.13004108
  ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk/28.0.13004108
  JAVA_VERSION: '17'
  GO_VERSION: '1.25'
  GOVULNCHECK_VERSION: 'v1.7.0'

jobs:
  go-vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/main/jni/core/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        id: vuln-ndk-cache
        with:
          path: ${{ env.ANDROID_NDK_PATH }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}
      - name: Install NDK if cache miss
        if: steps.vuln-ndk-cache.outputs.cache-hit != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"
      - name: Verify Go module locks are tidy
        working-directory: src/main/jni/core
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: govulncheck (android/arm64 + NDK)
        working-directory: src/main/jni/core
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '1'
          CC: ${{ env.ANDROID_NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        run: govulncheck ./...

  kotlin-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install detekt
        run: |
          set -euo pipefail
          curl -fsSLo detekt.jar https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7-all.jar
          echo '84beded283012cb2b38bcaef4996452fcd6069d2e9ca74b50eaa79e0ad21897e  detekt.jar' | sha256sum -c -
          echo '#!/usr/bin/env bash' | sudo tee /usr/local/bin/detekt >/dev/null
          echo "exec java -jar $PWD/detekt.jar \"\$@\"" | sudo tee -a /usr/local/bin/detekt >/dev/null
          sudo chmod +x /usr/local/bin/detekt
      - name: Detekt
        run: |
          detekt \
            --input src/main/kotlin \
            --build-upon-default-config \
            --config detekt.yml

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: src/main/jni/core/go.sum
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@b5c8a0dca2731e85b6e85238a73680f5151738e9  # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        id: ndk-cache
        with:
          path: ${{ env.ANDROID_NDK_PATH }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}
      - name: Install NDK if cache miss
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"

      - name: Verify Go module locks are tidy
        working-directory: src/main/jni/core
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Filesystem sandbox unit tests
        working-directory: src/main/jni/core
        run: go test path_security.go path_security_test.go

      - name: gofmt -d (Go source style)
        working-directory: src/main/jni/core
        run: |
          out=$(gofmt -d .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::run 'gofmt -w' on the files above"
            exit 1
          fi

      # All Android bridge files are gated by `//go:build android && cgo`;
      # linters need the Android cross-compile context to resolve stdlib imports.
      - name: golangci-lint (android/arm64 + NDK)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9  # v8
        with:
          version: v2.7.2
          working-directory: src/main/jni/core
          args: --config=${{ github.workspace }}/.golangci.yml
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '1'
          CC: ${{ env.ANDROID_NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang

      - name: Build libclash.so for all ABIs
        env:
          ANDROID_NDK: ${{ env.ANDROID_NDK_PATH }}
        run: ./build-native.sh

      - name: Verify JNI exports
        run: ./scripts/check-jni-exports.sh

      - name: Build .aar
        run: ./gradlew :assembleRelease --no-daemon
